<section id="carrito-seccion" class="bg-white shadow-2xl rounded-t-3xl fixed bottom-0 left-0 right-0 z-50 p-6 transform translate-y-full transition-transform duration-300">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold">Tu Carrito 🛒</h2>
        <button onclick="toggleCarrito()" class="text-gray-500 text-2xl">&times;</button>
    </div>

    <div id="items-carrito" class="max-h-60 overflow-y-auto mb-4">
        <p class="text-gray-400 italic">El carrito está vacío.</p>
    </div>

    <div class="border-t pt-4">
        <label class="block text-sm font-bold text-gray-700 mb-2">Selecciona Empresa de Envío:</label>
        <select id="metodo-envio" onchange="actualizarTotalFinal()" class="w-full p-3 border rounded-lg mb-4 bg-gray-50">
            <option value="0">Retiro en local (Gratis)</option>
            <option value="1200">Correo Argentino ($1.200)</option>
            <option value="1550">Andreani ($1.550)</option>
            <option value="1800">Vía Cargo ($1.800)</option>
        </select>

        <div class="flex justify-between text-xl font-bold text-blue-800">
            <span>Total Final:</span>
            <span id="total-final">$0</span>
        </div>

        <button class="w-full bg-green-600 text-white py-4 rounded-xl mt-4 font-bold text-lg hover:bg-green-700">
            Finalizar Compra por WhatsApp 📱
        </button>
    </div>
</section>

<button onclick="toggleCarrito()" class="fixed bottom-6 right-6 bg-blue-600 text-white p-4 rounded-full shadow-lg z-40">
    <span id="contador-carrito">0</span> 🛒
</button>

<script>
    let carrito = [];
    let subtotalProductos = 0;

    // Función para abrir/cerrar el carrito
    function toggleCarrito() {
        const carritoDiv = document.getElementById('carrito-seccion');
        carritoDiv.classList.toggle('translate-y-full');
    }

    // Función para agregar al carrito (Simulada para el ejemplo)
    function agregarAlCarrito(nombre, precio) {
        carrito.push({ nombre, precio });
        actualizarInterfazCarrito();
        // Feedback visual
        alert(nombre + " agregado al carrito");
    }

    function actualizarInterfazCarrito() {
        const contenedor = document.getElementById('items-carrito');
        const contador = document.getElementById('contador-carrito');
        contenedor.innerHTML = "";
        subtotalProductos = 0;

        carrito.forEach((prod, index) => {
            subtotalProductos += prod.precio;
            contenedor.innerHTML += `
                <div class="flex justify-between py-2 border-b">
                    <span>${prod.nombre}</span>
                    <span class="font-bold">$${prod.precio.toLocaleString()}</span>
                </div>
            `;
        });

        contador.innerText = carrito.length;
        actualizarTotalFinal();
    }

    function actualizarTotalFinal() {
        const costoEnvio = parseInt(document.getElementById('metodo-envio').value);
        const total = subtotalProductos + costoEnvio;
        document.getElementById('total-final').innerText = "$" + total.toLocaleString('es-AR');
    }
</script>
