<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLUCIONES.NET - Tienda de Tecnología</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d4ff;
            --dark: #121212;
            --card: #1e1e1e;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--primary);
            margin-bottom: 30px;
        }

        h1 { color: var(--primary); margin: 0; }
        p.subtitle { opacity: 0.8; }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid #333;
            transition: transform 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .product-card h3 { margin: 10px 0; }
        .price { font-size: 1.5rem; color: var(--primary); font-weight: bold; }

        button.add-btn {
            background: var(--primary);
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
        }

        .whatsapp-float {
            background: #25d366;
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            margin-top: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .cart-section {
            background: #222;
            padding: 20px;
            border-radius: 15px;
            margin-top: 40px;
            border: 1px dashed var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>SOLUCIONES.NET</h1>
        <p class="subtitle">Servicio Técnico y Lo Mejor en Tecnología</p>
    </header>

    <div class="product-grid">
        <div class="product-card">
            <i class="fas fa-mobile-alt" style="font-size: 3rem; color: var(--primary);"></i>
            <h3>Servicio Técnico</h3>
            <p>Reparación de celulares y PC</p>
            <p class="price">Consultar</p>
            <button class="add-btn" onclick="agregarAlCarrito('Servicio Técnico')">Pedir Info</button>
        </div>

        <div class="product-card">
            <i class="fas fa-watch" style="font-size: 3rem; color: var(--primary);"></i>
            <h3>Smartwatches</h3>
            <p>Modelos Soul y más</p>
            <p class="price">$25.000</p>
            <button class="add-btn" onclick="agregarAlCarrito('Smartwatch Soul')">Agregar</button>
        </div>
    </div>

    <div class="cart-section">
        <h2>Mi Pedido</h2>
        <ul id="lista-carrito">
            <li>El carrito está vacío</li>
        </ul>
        <a href="#" id="whatsapp-link" class="whatsapp-float" onclick="enviarWhatsapp()">
            <i class="fab fa-whatsapp"></i> Enviar Pedido a Oskar
        </a>
    </div>
</d…
