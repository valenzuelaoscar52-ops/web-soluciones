<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLUCIONES.NET - Tienda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #00d4ff; --bg: #0a0a0a; --card: #161616; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding-top: 60px; }
        
        /* NAVBAR */
        nav { background: #000; padding: 15px; display: flex; align-items: center; position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 1px solid var(--accent); }
        .btn-menu { font-size: 25px; color: var(--accent); cursor: pointer; margin-right: 15px; background: none; border: none; }
        
        /* MENU LATERAL */
        .sidebar { position: fixed; top: 0; left: -100%; width: 260px; height: 100%; background: #000; transition: 0.3s; z-index: 2000; padding-top: 60px; border-right: 1px solid var(--accent); }
        .sidebar.active { left: 0; }
        .sidebar a { display: block; padding: 15px; color: white; text-decoration: none; border-bottom: 1px solid #111; cursor: pointer; }

        /* GALERIA ORGANIZADA */
        .container { padding: 15px; }
        .fila { margin-bottom: 30px; }
        .titulo-fila { color: var(--accent); border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 15px; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; }
        
        /* PRODUCTO */
        .item { background: var(--card); padding: 10px; border-radius: 10px; text-align: center; border: 1px solid #222; }
        .img-box { width: 100%; height: 150px; background: #000; border-radius: 5px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; }
        .item img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .item h3 { font-size: 0.9rem; margin: 5px 0; height: 35px; overflow: hidden; }
        .item p { color: var(--accent); font-weight: bold; margin: 5px 0; }
        
        /* CONTROLES */
        .cant { width: 40px; padding: 5px; background: #000; color: white; border: 1px solid #444; border-radius: 3px; }
        .btn-add { background: var(--accent); color: #000; border: none; padding: 8px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        /* CARRITO */
        .cart-toggle { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: #000; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; z-index: 3000; }
        #modal-cart { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 4000; padding: 20px; box-sizing: border-box; }
        .cart-content { background: var(--card); padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; }
        .btn-wa { background: #25d366; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <nav>
        <button class="btn-menu" onclick="toggleM()"><i class="fas fa-bars"></i> Menú</button>
        <span style="font-weight: bold; color: var(--accent);">SOLUCIONES.NET</span>
    </nav>

    <div id="sideB" class="sidebar">
        <a onclick="toggleM()">Cerrar Menú</a>
        <a onclick="jump('sec-sw')">Smartwatches</a>
        <a onclick="jump('sec-vin')">Auriculares Vincha</a>
        <a onclick="jump('sec-oid')">Auriculares de Oído</a>
        <a onclick="jump('sec-lib')">Librería / Agendas</a>
    </div>

    <div class="container">
        <div class="fila" id="sec-sw">
            <h2 class="titulo-fila">Smartwatches</h2>
            <div class="grid">
                <div class="item">
                    <div class="img-box"><img src="1421.jpeg"></div>
                    <h3>Smartwatch Series</h3>
                    <p>$25.000</p>
                    <input type="number" value="1" min="1" id="c-sw" class="cant">
                    <button class="btn-add" onclick="add('Smartwatch', 25000, 'c-sw')">Agregar</button>
                </div>
            </div>
        </div>

        <div class="fila" id="sec-vin">
            <h2 class="titulo-fila">Auriculares Vincha</h2>
            <div class="grid">
                <div class="item">
                    <div class="img-box"><img src="AURICULAR CAPIBARA CON BOLSO.jpeg"></div>
                    <h3>Capibara c/ Bolso</h3>
                    <p>$18.500</p>
                    <input type="number" value="1" min="1" id="c-vin" class="cant">
                    <button class="btn-add" onclick="add('Capibara c/ Bolso', 18500, 'c-vin')">Agregar</button>
                </div>
            </div>
        </div>

        <div class="fila" id="sec-oid">
            <h2 class="titulo-fila">Auriculares de Oído</h2>
            <div class="grid">
                <div class="item">
                    <div class="img-box"><img src="ACTION.jpeg"></div>
                    <h3>In-Ear Action</h3>
                    <p>$9.800</p>
                    <input type="number" value="1" min="1" id="c-oid" class="cant">
                    <button class="btn-add" onclick="add('Auricular Action', 9800, 'c-oid')">Agregar</button>
                </div>
            </div>
        </div>

        <div class="fila" id="sec-lib">
            <h2 class="titulo-fila">Librería</h2>
            <div class="grid">
                <div class="item">
                    <div class="img-box"><img src="AGENDAS.jpeg"></div>
                    <h3>Agenda 2026</h3>
                    <p>$5.500</p>
                    <input type="number" value="1" min="1" id="c-lib" class="cant">
                    <button class="btn-add" onclick="add('Agenda 2026', 5500, 'c-lib')">Agregar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="cart-toggle" onclick="showC()"><i class="fas fa-shopping-cart"></i></div>

    <div id="modal-cart">
        <div class="cart-content">
            <h2 style="color:var(--accent)">Tu Pedido</h2>
            <div id="lista-p">Vacío</div>
            <hr>
            <p>Envío: 
                <select id="envio" style="width:100%; background:#000; color:white; padding:5px;">
                    <option>Correo Argentino</option>
                    <option>Andreani</option>
                    <option>Vía Cargo</option>
                </select>
            </p>
            <h3 id="total-v">Total: $0</h3>
            <button class="btn-wa" onclick="finish()">Finalizar por WhatsApp</button>
            <button onclick="showC()" style="background:none; border:none; color:gray; margin-top:10px;">Cerrar</button>
        </div>
    </div>

    <script>
        let cart = [];
        function toggleM() { document.getElementById('sideB').classList.toggle('active'); }
        function jump(id) { document.getElementById(id).scrollIntoView(); toggleM(); }
        function showC() { const m = document.getElementById('modal-cart'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; }
        
        function add(n, p, id) {
            const q = parseInt(document.getElementById(id).value);
            cart.push({ n, p, q });
            upd();
        }

        function upd() {
            let h = ""; let t = 0;
            cart.forEach(i => {
                h += <p>${i.q}x ${i.n} - $${i.p * i.q}</p>;
                t += (i.p * i.q);
            });
            document.getElementById('lista-p').innerHTML = h || "Vacío";
            document.getElementById('total-v').innerText = "Total: $" + t;
        }

        function finish() {
            if(cart.length === 0) return alert("Agregá algo!");
            let msg = "Hola SOLUCIONES.NET, mi pedido:\n";
            cart.forEach(i => msg += - ${i.q}x ${i.n} ($${i.p*i.q})\n);
            msg += "\nEnvío: " + document.getElementById('envio').value;
            window.open(https://wa.me/543794517852?text=${encodeURIComponent(msg)});
        }
    </script>
</body>
</html>
